name: otel_chopper
description: OpenTelemetry instrumentation for `package:chopper`. A
  Chopper Interceptor that emits HTTP CLIENT spans with `http.*`
  semconv attributes and injects W3C trace context headers.
version: 0.1.0-wip
repository: https://github.com/dartastic/otel_chopper
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  chopper: ^8.0.0
  dartastic_opentelemetry: ^1.1.0-beta.4
  dartastic_opentelemetry_api: ^1.0.0-beta.6

dev_dependencies:
  pubspec_parse: ^1.5.0
  pub_semver: ^2.0.0
  dart_flutter_team_lints: ^3.5.2
  http: ^1.0.0
  test: ^1.26.3
